# corpus: positive
# models: spoofable actor gate -- "auto-merge if the actor is dependabot" on
#   pull_request_target; github.actor is whoever triggered the latest event,
#   which an attacker can arrange to be dependabot[bot].
# expect: cicd-sec-1-spoofable-actor-condition
name: Dependabot auto-merge

on:
  pull_request_target:

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash "$PR_URL"
