# corpus: lookalike
# models: a legitimate pull_request_target use -- labels the PR from metadata
#   only, never checks out or executes fork code, pinned, least privilege.
# expect-none: cicd-sec-1-ppe-checkout
# expect-none: cicd-sec-4-ppe-shell-injection
# expect-none: cicd-sec-3-unpinned-action
# expect-none: cicd-sec-5-missing-permissions
name: Label PRs

on:
  pull_request_target:
    types: [opened, synchronize]

permissions:
  contents: read

concurrency:
  group: labeler-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  label:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/labeler@8558fd74291d67161a8a78ce36a881fa63b766a9 # v5.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
