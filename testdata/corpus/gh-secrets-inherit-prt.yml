# corpus: positive
# models: a pull_request_target workflow that calls a reusable workflow with
#   `secrets: inherit`, handing every repo secret to a job fed by PR input.
# expect: cicd-sec-4-secrets-inherit-pr-target
name: PR checks

on:
  pull_request_target:

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/reusable-checks.yml
    with:
      ref: ${{ github.event.pull_request.head.sha }}
    secrets: inherit
