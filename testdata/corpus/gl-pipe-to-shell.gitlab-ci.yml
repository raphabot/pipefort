# corpus: positive
# models: remote installer piped straight into a shell, and a binary downloaded
#   without checksum verification (the Codecov bash-uploader shape, 2021).
# expect: best-prac-1-pipe-to-shell
stages: [test]

coverage:
  stage: test
  image: alpine:3.20
  timeout: 10m
  script:
    - apk add --no-cache curl bash
    - curl -s https://codecov.example.com/bash | bash
    - curl -fsSLo /usr/local/bin/tool https://example.com/releases/tool-linux-amd64
    - chmod +x /usr/local/bin/tool
