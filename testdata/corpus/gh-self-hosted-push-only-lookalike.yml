# corpus: lookalike
# models: self-hosted runner used only on pushes to main from trusted
#   maintainers (no fork PR can schedule onto it).
# expect-none: cicd-sec-1-ppe-checkout
name: GPU tests (main)

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: gpu-main
  cancel-in-progress: true

jobs:
  gpu:
    runs-on: [self-hosted, linux, gpu]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: pip install -e . && pytest -m gpu
