# golangci-lint v2 configuration (golangci/golangci-lint-action@v9 runs v2).
# Deliberately minimal: the `standard` linter set (errcheck, govet,
# ineffassign, staticcheck, unused). CI runs with only-new-issues, so issues
# that predate this file don't block PRs; tighten this over time.
version: "2"

linters:
  default: standard

formatters:
  enable:
    - gofmt
