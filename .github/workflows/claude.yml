name: claude

# `@claude` in a PR/issue comment or review: Claude answers, or pushes fixes to
# the PR branch. Only users with write access can trigger it (the action's default).
# Runs on the Claude subscription via CLAUDE_CODE_OAUTH_TOKEN (from
# `claude setup-token`). It never uses an API key and is skipped when the
# secret is unset.
# GitHub identity: GITHUB_TOKEN, so no GitHub App install is needed. Commits it
# pushes won't re-trigger CI. Install the Claude GitHub App and drop the
# github_token input if you want that.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

permissions: {}

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read # lets Claude read CI results on the PR
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    steps:
      - name: Skip without subscription token
        if: env.CLAUDE_CODE_OAUTH_TOKEN == ''
        run: echo "::notice::CLAUDE_CODE_OAUTH_TOKEN not set; skipping."

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        if: env.CLAUDE_CODE_OAUTH_TOKEN != ''
        with:
          fetch-depth: 0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff  # v5
        if: env.CLAUDE_CODE_OAUTH_TOKEN != ''
        with:
          go-version-file: go.mod

      - name: Claude
        if: env.CLAUDE_CODE_OAUTH_TOKEN != ''
        uses: anthropics/claude-code-action@756cc22e19660d20e8cc9496b4f242475a7f7790  # v1.0.235
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          classify_inline_comments: "false"
          # The repo's .claude/settings.json hooks apply here too (no pushes to
          # main, no prod deploys or migrations, no .env edits).
          claude_args: |
            --allowedTools "Edit,MultiEdit,Write,Read,Grep,Glob,Bash(scripts/verify.sh*),Bash(go build:*),Bash(go vet:*),Bash(go test:*),Bash(go run . *),Bash(gofmt:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*)"
            --append-system-prompt "Follow CLAUDE.md and REVIEW.md. Before committing, run: scripts/verify.sh. Only commit once it is green. Keep changes scoped to what the comment asks."
